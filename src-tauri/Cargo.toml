[package]
name = "telefon-dukkan-paneli"
version = "0.1.0"
description = "Telefon dükkanı için çevrimdışı stok, satış ve tamir takip uygulaması"
authors = ["Telefon Dükkanı"]
edition = "2021"

[lib]
name = "telefon_dukkan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
# Hata ayıklama sembollerini at: dosya küçülür, iç yapı dışarı sızmaz.
strip = "symbols"
lto = "thin"
# Not: kaynak yollarının (C:\Users\<ad>\.cargo\...) exe içine gömülmesi
# `npm run tauri:build` içindeki --remap-path-prefix ile engellenir.
# Bkz. scripts/build-release.mjs

