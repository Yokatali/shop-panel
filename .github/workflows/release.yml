name: Sürüm yayınla

# Yalnızca "v" ile başlayan bir etiket gönderildiğinde çalışır.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle-ve-yayinla:
    runs-on: windows-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Rust kur
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust derleme önbelleği
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Etiket ile dosyalardaki sürüm uyuşmazsa derlemeyi burada durdur.
      # Aksi halde "v0.1.2" etiketiyle 0.1.1 sürümü yayınlanır ve kullanıcıların
      # uygulaması güncellemeyi göremez.
      - name: Sürüm numarası etiketle uyuşuyor mu
        shell: bash
        run: |
          ETIKET="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "Etiket           : $ETIKET"
          echo "tauri.conf.json  : $CONF"
          echo "package.json     : $PKG"
          if [ "$ETIKET" != "$CONF" ] || [ "$ETIKET" != "$PKG" ]; then
            echo ""
            echo "HATA: Sürüm numaraları etiketle uyuşmuyor."
            echo "package.json ve src-tauri/tauri.conf.json içindeki \"version\" değerini"
            echo "$ETIKET yapıp yeniden etiketleyin."
            exit 1
          fi
          echo "Uyumlu."

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Testleri çalıştır
        run: |
          npx tsc --noEmit
          npx vitest run --configLoader runner
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Kurulum dosyasını derle, imzala ve yayınla
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Güncelleme imzası. Özel anahtar depoda değil, GitHub secret olarak durur.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dükkan Paneli ${{ github.ref_name }}"
          releaseBody: |
            ### Kurulum
            Aşağıdaki `.exe` dosyasını indirip çalıştırın.

            Zaten kurulu ise uygulama içinden **Ayarlar → Veri → Güncellemeleri denetle**
            ile güncelleyebilirsiniz. Ürünleriniz, satışlarınız ve tamir kayıtlarınız korunur.
          releaseDraft: false
          prerelease: false
          # Otomatik güncellemenin okuduğu latest.json dosyasını üretir.
          includeUpdaterJson: true
