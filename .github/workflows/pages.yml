name: İndirme sitesini yayınla

# site/ klasörü değiştiğinde GitHub Pages'e yayınlar.
#
# ÖNEMLİ: Bu iş akışı başarısız olursa "Re-run all jobs" KULLANMAYIN.
# Yeniden çalıştırma, site paketini aynı çalışmaya ikinci kez yükler ve
# deploy-pages "Multiple artifacts named github-pages" hatası verir.
# Bunun yerine Actions sekmesinden "Run workflow" ile YENİ bir çalışma başlatın.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}

    steps:
      - name: Kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pages ayarla
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: site/ klasörünü paketle
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Yayınla
        id: dagitim
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
